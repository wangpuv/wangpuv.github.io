<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="王普，资深后端与 AI Agent 应用工程师。20 年软件研发经验，专注将大型后端和分布式系统能力应用到 AI Agent 产品开发。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Geist:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set theme + language before paint to avoid a flash of the wrong state.
      (function () {
        var de = document.documentElement;
        de.classList.add('js');
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          de.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
        } catch (e) {}
        try {
          var routeLang = location.pathname.match(/^\/(zh|en)(?:\/|$)/);
          var lang = routeLang ? routeLang[1] : (location.pathname === '/' ? 'zh' : localStorage.getItem('lang'));
          if (lang !== 'zh' && lang !== 'en') {
            var langs = navigator.languages || [navigator.language || ''];
            var lower = langs.map(function (l) { return l.toLowerCase(); });
            var prefersZh = lower.some(function (l) { return l.indexOf('zh') === 0; });
            var prefersEn = lower.some(function (l) { return l.indexOf('en') === 0; });
            lang = (prefersEn && !prefersZh) ? 'en' : 'zh';
          }
          de.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
        } catch (e) {}
      })();
    </script>
    <!--app-head-->
    <title>王普 — 资深后端与 AI Agent 应用工程师</title>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
