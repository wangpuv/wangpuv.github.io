<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">小步学习伙伴技术架构</title>
  <desc id="desc">浏览器、FastAPI、Agent 运行时、模型角色、数据存储和生成内容沙箱之间的关系。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34d399"/></marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}.title{font-size:20px;font-weight:700;fill:#f8fafc}.sub{font-size:10px;fill:#94a3b8}.region{font-size:10px;font-weight:600}.name{font-size:12px;font-weight:600;fill:#f8fafc}.detail{font-size:9px;fill:#94a3b8}.label{font-size:8px;fill:#cbd5e1}
    </style>
  </defs>
  <rect width="1100" height="720" fill="#0f172a"/><rect width="1100" height="720" fill="url(#grid)"/>
  <text class="title" x="32" y="38">本地单进程 Agent 产品架构</text>
  <text class="sub" x="32" y="58">原生 Web 前端 + FastAPI + 自主工具循环 + 分层持久化；模型生成代码在独立沙箱执行</text>

  <rect x="30" y="88" width="1040" height="115" rx="12" fill="none" stroke="#22d3ee" stroke-dasharray="8 4"/><text class="region" x="46" y="108" fill="#22d3ee">浏览器层</text>
  <rect x="70" y="124" width="250" height="58" rx="7" fill="#0f172a"/><rect x="70" y="124" width="250" height="58" rx="7" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/><text class="name" x="195" y="148" text-anchor="middle">学习界面</text><text class="detail" x="195" y="166" text-anchor="middle">原生 HTML / JS · REST + WebSocket</text>
  <rect x="425" y="124" width="250" height="58" rx="7" fill="#0f172a"/><rect x="425" y="124" width="250" height="58" rx="7" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/><text class="name" x="550" y="148" text-anchor="middle">家长确认门禁</text><text class="detail" x="550" y="166" text-anchor="middle">订正识别结果 · 确认模型提议答案</text>
  <rect x="780" y="124" width="250" height="58" rx="7" fill="#0f172a"/><rect x="780" y="124" width="250" height="58" rx="7" fill="rgba(136,19,55,.35)" stroke="#fb7185" stroke-width="1.5"/><text class="name" x="905" y="148" text-anchor="middle">交互页沙箱</text><text class="detail" x="905" y="166" text-anchor="middle">CSP-first · iframe sandbox=allow-scripts</text>

  <path d="M195 182V235" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/><path d="M550 182V235" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/><path d="M905 235V182" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <rect x="30" y="235" width="1040" height="250" rx="12" fill="none" stroke="#34d399" stroke-dasharray="8 4"/><text class="region" x="46" y="255" fill="#34d399">FastAPI 应用与 Agent 运行时</text>
  <rect x="70" y="280" width="210" height="70" rx="7" fill="#0f172a"/><rect x="70" y="280" width="210" height="70" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text class="name" x="175" y="307" text-anchor="middle">Web / Turn 编排层</text><text class="detail" x="175" y="325" text-anchor="middle">会话锁 · 流式事件 · 必须写回</text><text class="detail" x="175" y="339" text-anchor="middle">超时 / 失败收尾 / 后台任务</text>
  <rect x="340" y="280" width="210" height="70" rx="7" fill="#0f172a"/><rect x="340" y="280" width="210" height="70" rx="7" fill="rgba(59,130,246,.3)" stroke="#60a5fa" stroke-width="1.5"/><text class="name" x="445" y="307" text-anchor="middle">Agent Loop</text><text class="detail" x="445" y="325" text-anchor="middle">模型自主决定讲法与工具</text><text class="detail" x="445" y="339" text-anchor="middle">max_steps + turn deadline</text>
  <rect x="610" y="280" width="210" height="70" rx="7" fill="#0f172a"/><rect x="610" y="280" width="210" height="70" rx="7" fill="rgba(120,53,15,.3)" stroke="#fbbf24" stroke-width="1.5"/><text class="name" x="715" y="307" text-anchor="middle">工具与服务</text><text class="detail" x="715" y="325" text-anchor="middle">诊断 · 激活 · 重测 · 计划</text><text class="detail" x="715" y="339" text-anchor="middle">交互页请求 · 错题检索</text>
  <rect x="880" y="280" width="150" height="70" rx="7" fill="#0f172a"/><rect x="880" y="280" width="150" height="70" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text class="name" x="955" y="307" text-anchor="middle">Digest 写回</text><text class="detail" x="955" y="325" text-anchor="middle">每个孩子 turn</text><text class="detail" x="955" y="339" text-anchor="middle">结构化输出</text>
  <path d="M280 315H340" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-green)"/><path d="M550 315H610" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-green)"/><path d="M820 315H880" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <rect x="70" y="390" width="960" height="65" rx="8" fill="#0f172a"/><rect x="70" y="390" width="960" height="65" rx="8" fill="rgba(30,41,59,.5)" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="name" x="120" y="417">LLMClient</text><text class="detail" x="120" y="437">统一模型 I/O、能力门禁、超时与稳定错误结构</text>
  <text class="label" x="390" y="417">teaching · 流式 + tools</text><text class="label" x="390" y="437">digest · structured output</text>
  <text class="label" x="650" y="417">vision · screenshot intake</text><text class="label" x="650" y="437">visualization · 最小教学上下文</text>
  <path d="M445 350V390" stroke="#64748b" marker-end="url(#arrow)"/><path d="M955 350V390" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M890 390V365H905V203" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text class="label" x="916" y="374">仅交付规范化 HTML 片段</text>

  <rect x="30" y="520" width="1040" height="155" rx="12" fill="none" stroke="#a78bfa" stroke-dasharray="8 4"/><text class="region" x="46" y="540" fill="#a78bfa">per-kid 数据与产物</text>
  <path d="M175 350V580H220" fill="none" stroke="#64748b" marker-end="url(#arrow)"/><path d="M715 350V580H700" fill="none" stroke="#64748b" marker-end="url(#arrow)"/><path d="M955 455V580H880" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <g transform="translate(70 570)"><rect width="220" height="70" rx="7" fill="#0f172a"/><rect width="220" height="70" rx="7" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/><text class="name" x="110" y="29" text-anchor="middle">SQLite 事实层</text><text class="detail" x="110" y="49" text-anchor="middle">错题 · 诊断 · turn · outbox · 历史</text></g>
  <g transform="translate(330 570)"><rect width="220" height="70" rx="7" fill="#0f172a"/><rect width="220" height="70" rx="7" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/><text class="name" x="110" y="29" text-anchor="middle">画像 profile.json</text><text class="detail" x="110" y="49" text-anchor="middle">事实 · 观察 · 薄弱点 · 教学提示</text></g>
  <g transform="translate(590 570)"><rect width="220" height="70" rx="7" fill="#0f172a"/><rect width="220" height="70" rx="7" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/><text class="name" x="110" y="29" text-anchor="middle">分科计划 JSON</text><text class="detail" x="110" y="49" text-anchor="middle">系统推荐 + 家长覆盖 + 执行记录</text></g>
  <g transform="translate(850 570)"><rect width="180" height="70" rx="7" fill="#0f172a"/><rect width="180" height="70" rx="7" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/><text class="name" x="90" y="29" text-anchor="middle">文件产物</text><text class="detail" x="90" y="49" text-anchor="middle">题图 · 交互页 artifact</text></g>
  <text class="sub" x="32" y="700">边界：单机、本地 Web App；不提前引入消息队列、分布式锁或通用插件框架</text>
</svg>
